# Conda environment for OrthoReg.
# Create with: conda env create -f environment.yml
# Activate with: conda activate orthoreg
# Dependencies (and their pins) are declared once, in pyproject.toml.

name: orthoreg
channels:
  - conda-forge

dependencies:
  - python=3.10
  - pip
  - pip:
    - -e .[dev]
