dataset_name: duffing

# True terms outside the symbolic library: the cubic stiffness c * x0**3
# in the x1 equation (used by the full-support F1).
n_out_of_library_terms: 1

forecaster:
  # Trajectory budget. Goring et al. (2024), Appendix D.1 use t_int = 40.
  n_samples: 1000
  times: 40
  granularity: 100
  sampling_scheme: regular
  diff_method: finite_difference

  # Unforced Duffing oscillator parameters (Goring et al., 2024).
  #   x' = y
  #   y' = a * y - x * (b + c * x**2)
  # The cubic stiffness term c * x**3 is intentionally absent from the
  # symbolic library and must be captured by the neural component.
  a: -0.5
  b: -1.0
  c: 0.1

  # Initial conditions are set in DuffingOscillatorDataset.get_standard_dataset:
  # training restricted to the positive basin (x > 0), OOD T2 evaluates the
  # negative basin, OOD T3 the negative basin with parameter shifts
  # (a, b, c) -> (1.2 a, 1.2 b, 2.0 c).
