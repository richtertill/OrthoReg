# @package _global_
#
# Generic GPU SLURM launcher. Replace ``???`` with values for your site.
# Submit with for example:
#   python -m orthoreg.training.train -m \
#       launcher=slurm_gpu hydra.launcher.partition=mygpu

defaults:
  - override /hydra/launcher: submitit_slurm

hydra:
  launcher:
    partition: ???              # e.g. gpu, gpu_long
    qos: ???                    # delete this line if your site has no QOS
    gres: gpu:1
    cpus_per_task: 8
    mem_gb: 32
    timeout_min: 1440           # 1 day
    array_parallelism: 100
