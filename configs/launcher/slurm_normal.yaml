# @package _global_
#
# Generic CPU SLURM launcher. Replace ``???`` with values for your site.
# Submit with for example:
#   python -m orthoreg.training.train -m \
#       launcher=slurm_normal hydra.launcher.partition=mypartition

defaults:
  - override /hydra/launcher: submitit_slurm

hydra:
  launcher:
    partition: ???      # e.g. cpu, normal
    qos: ???            # delete this line if your site has no QOS
    cpus_per_task: 32
    mem_gb: 64
    timeout_min: 4320   # 3 days
    array_parallelism: 100
