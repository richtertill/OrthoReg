# Reproducibility.
# Seeds numpy, torch (cpu+cuda), python random, and Lightning DataLoader
# workers via lightning.fabric.seed_everything at the top of train().
# Override on the command line with ``training.seed=42``.
seed: 0

# Optimization.
lr: 0.0089
gradient_clip_value: 1.0
batch_size: 1024
n_derivative_epochs: 2000

# Symbolic library / SINDy thresholding.
polynomial_degree: 2
n_frequencies: 1
symbolic_threshold: 0.045

# Regularization. ``regularization`` selects the term that decouples the
# neural augmentation from the symbolic library:
#   orthogonal -> lambda * sum_{j,k} <f_aug, phi_j e_k>_D^2 (OrthoReg).
#   l2         -> lambda * mean ||f_aug||^2 (L2-regularized hybrid baseline).
#   none       -> no penalty (paired with model=sindy for pure SINDy).
regularization: orthogonal

# Per-regularization strengths: *_node_reg_weight is lambda (penalty on the
# neural augmentation), *_symbolic_reg_weight is mu (L1 on the symbolic
# coefficients). Set ``l1_reg_weight`` to override mu for any method.
l2_node_reg_weight: 0.005
l2_symbolic_reg_weight: 0.001
orthogonal_node_reg_weight: 0.005
orthogonal_symbolic_reg_weight: 0.003

# Stage 2: continue training on the OOD-T3 extrapolation grid with a lower
# learning rate. Disable with ``training.retrain=False`` for a single-stage
# run.
retrain: true
retrain_lr: 0.001
n_retrain_epochs: 500
retrain_patience: 100
# Hybrids: set to true to threshold the phase-1 coefficients at
# symbolic_threshold and keep that support fixed during stage 2 (only the
# active coefficients and the network are refit, on the data-fit loss).
retrain_fix_support: false

# Optional neural-network freezing during the first ``freeze_epochs``
# epochs (lets the symbolic structure stabilize before the augmentation
# kicks in). Disabled by default.
freeze_neural: false
freeze_epochs: 0

# Save a true-vs-predicted trajectory plot after training.
plot_trajectories: true

# Logging.
wandb_project: orthoreg
# Optional W&B entity. If unset, training reads $WANDB_ENTITY from the
# environment; if neither is provided, training falls back to the local
# CSV logger and never contacts wandb.ai.
wandb_username: null
