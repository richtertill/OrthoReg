# @package model
# Pure-SINDy ablation: symbolic component only, no neural augmentation.
# Pair with training.regularization=none.

hybrid_setting: false
symbolic_regression: sindy

# Numerical-derivative method (see orthoreg.data.datamodule).
diff_method: smooth

# Augmentation-MLP shape is unused when ``hybrid_setting=false`` but kept
# here so command-line overrides like ``model.hidden_dim=...`` do not
# error. (``orthoreg.feature_library.setup_model`` builds the MLP, but it is
# neither used nor trained when ``hybrid_setting=false``.)
hidden_dim: 64
num_layers: 3
